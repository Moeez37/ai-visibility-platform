services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/dev.db
      CORS_ORIGINS: http://localhost:4200
    volumes:
      - backend-data:/data

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  backend-data:
